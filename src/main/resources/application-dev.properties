# -------------------------------
# DYNAMIC MULTI-DATASOURCE (Examples)
# -------------------------------
app.swagger.enabled=true
app.request-logging.enabled=true
app.cors.allowed-origin-patterns=*

app.datasource.enabled=true
app.datasource.primary=core

app.datasource.connections.core.url=jdbc:postgresql://localhost:5432/letter_serial_db
app.datasource.connections.core.username=sa
app.datasource.connections.core.password=pass123*
app.datasource.connections.core.driver-class-name=org.postgresql.Driver
app.datasource.connections.core.maximum-pool-size=10
app.datasource.connections.core.minimum-idle=2

# Let Hibernate update the development schema from the JPA entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Email microservice integration (dev)
email.microservice.url=${EMAIL_MICROSERVICE_URL:http://localhost:8081/api/email/send}
email.microservice.api-key=${EMAIL_MICROSERVICE_API_KEY:dev-api-key}
email.microservice.timeout-ms=${EMAIL_MICROSERVICE_TIMEOUT_MS:5000}
