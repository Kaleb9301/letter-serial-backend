# ===============================
# SERVER
# ===============================
server.port=8080
server.servlet.context-path=/letter_memo
spring.output.ansi.enabled=always

# ===============================
# PROFILE
# ===============================
# Choose the runtime profile explicitly with `--spring.profiles.active=dev` or `prod`.
# Leaving this unset keeps the template runnable for tests and local bootstrapping.
spring.profiles.active=dev
spring.jpa.open-in-view=false



# (Autoconfigure not excluded) Let Spring Boot configure JPA when a DataSource bean is available.

# ===============================
# LOGGING
# ===============================
app.logging.base-path=${APP_LOG_BASE_PATH:${catalina.base:${CATALINA_BASE:logs}}/logs}
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.level=%5p [cid:%X{correlationId:-N/A}]

# ===============================
# JACKSON
# ===============================
spring.jackson.serialization.indent_output=true

# ===============================
# DEVTOOLS
# ===============================
spring.devtools.restart.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=500ms
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.livereload.enabled=true

# ===============================
# JWT (OPTIONAL)
# ===============================
jwt.secret==${JWT_SECRET:mySuperLongSecretKeyForJWTThatIsAtLeast32CharactersLongForSecurity}
# Access token: 30 minutes (1800000 ms = 30 * 60 * 1000)
jwt.expiration=1800000
jwt.refresh-expiration=3600000


# ===============================
# SECURITY (TEMPLATE DEFAULTS)
# ===============================
spring.security.user.name=admin
spring.security.user.password=123456
app.cors.allowed-origin-patterns=*

# ===============================
# SWAGGER / OPENAPI
# ===============================
app.swagger.enabled=true
springdoc.api-docs.enabled=${app.swagger.enabled:true}
springdoc.swagger-ui.enabled=${app.swagger.enabled:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===============================
# ACTUATOR (OPS)
# ===============================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

# ===============================
# APP METADATA
# ===============================
info.app.name=letter-serial-backend
info.app.description=Reusable Spring Boot template
info.app.version=0.0.1-SNAPSHOT

# ===============================
# REQUEST LOGGING
# ===============================
app.request-logging.enabled=true

# ===============================
# LDAP AUTH INTEGRATION
# ===============================
app.auth.ldap.enabled=true
app.auth.ldap.url=http://boainhousesys.bankofabyssinia.com:8085/auth-service/api/auth
app.auth.ldap.connect-timeout-ms=5000
app.auth.ldap.read-timeout-ms=15000

